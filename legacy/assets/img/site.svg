<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract industrial site">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9bfa8"/>
      <stop offset="0.5" stop-color="#a2957a"/>
      <stop offset="1" stop-color="#5c5342"/>
    </linearGradient>
    <filter id="sgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#sg)"/>

  <!-- terraced benches -->
  <g opacity="0.55">
    <path d="M0 520 L1200 430 L1200 520 L0 610 Z" fill="#7d7159"/>
    <path d="M0 640 L1200 545 L1200 645 L0 740 Z" fill="#6a6049"/>
    <path d="M0 770 L1200 665 L1200 900 L0 900 Z" fill="#544c3a"/>
  </g>

  <!-- structures -->
  <g fill="#3a3529" opacity="0.85">
    <rect x="220" y="230" width="26" height="300"/>
    <rect x="150" y="300" width="170" height="18"/>
    <rect x="880" y="180" width="30" height="350"/>
    <rect x="800" y="250" width="190" height="20"/>
    <path d="M470 520 L560 300 L650 520 Z"/>
  </g>

  <rect width="1200" height="900" filter="url(#sgrain)" opacity="0.5"/>
</svg>
