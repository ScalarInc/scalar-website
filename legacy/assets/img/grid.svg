<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract network grid">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <pattern id="mesh" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#gg)"/>
  <rect width="1200" height="900" fill="url(#mesh)"/>

  <g stroke="#c98cc4" stroke-opacity="0.5" fill="none">
    <circle cx="600" cy="450" r="120"/>
    <circle cx="600" cy="450" r="210"/>
    <circle cx="600" cy="450" r="300"/>
  </g>

  <g fill="#c98cc4">
    <circle cx="600" cy="450" r="9"/>
    <circle cx="720" cy="450" r="5"/>
    <circle cx="450" cy="300" r="5"/>
    <circle cx="810" cy="660" r="5"/>
    <circle cx="390" cy="600" r="4"/>
  </g>

  <g stroke="#c98cc4" stroke-opacity="0.32" stroke-width="1">
    <path d="M600 450 L450 300 M600 450 L810 660 M600 450 L390 600 M600 450 L720 450"/>
  </g>
</svg>
