<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract team composition">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2c4030"/>
      <stop offset="1" stop-color="#16211a"/>
    </linearGradient>
    <filter id="tgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#tg)"/>

  <!-- soft depth-of-field foliage -->
  <g opacity="0.45">
    <path d="M-40 900 C 120 620 60 380 180 120 L 300 160 C 220 400 260 660 180 900 Z" fill="#3d5a3f"/>
    <path d="M1240 900 C 1100 660 1160 420 1040 180 L 930 230 C 1030 460 990 690 1060 900 Z" fill="#3d5a3f"/>
  </g>

  <!-- abstracted figures -->
  <g>
    <g fill="#24422b">
      <rect x="380" y="330" width="120" height="330" rx="58"/>
      <rect x="530" y="300" width="130" height="360" rx="62"/>
      <rect x="690" y="345" width="118" height="315" rx="56"/>
    </g>
    <rect x="536" y="392" width="118" height="150" rx="46" fill="#e9d3ea" opacity="0.85"/>
    <g fill="#1b2f21">
      <rect x="392" y="620" width="44" height="250" rx="20"/>
      <rect x="448" y="620" width="44" height="250" rx="20"/>
      <rect x="546" y="600" width="46" height="270" rx="21"/>
      <rect x="602" y="600" width="46" height="270" rx="21"/>
      <rect x="700" y="630" width="44" height="240" rx="20"/>
      <rect x="756" y="630" width="44" height="240" rx="20"/>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#tgrain)" opacity="0.5"/>
</svg>
