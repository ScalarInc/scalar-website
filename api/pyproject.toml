[project]
name = "scalar-contact-api"
version = "0.1.0"
description = "Contact form service for the Scalar marketing site — validates enquiries and delivers them via Resend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.uv]
package = false
